  <title>基準 例示一覧</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;
      background:#f2f2f7;
      min-height:100vh;
      -webkit-text-size-adjust:100%;
    }

    /* ── ヘッダー ── */
    .header{
      background:#1c1c1e;
      color:#fff;
      padding:12px 16px;
      padding-top:max(12px,env(safe-area-inset-top));
      position:sticky;top:0;z-index:100;
      display:flex;align-items:center;gap:8px;
    }
    .header h1{font-size:17px;font-weight:600;flex:1}
    #backBtn{
      background:none;border:none;color:#0a84ff;
      font-size:16px;cursor:pointer;
      padding:4px 0;display:none;
      align-items:center;gap:2px;white-space:nowrap;
    }

    /* ── インデックス ── */
    #indexView{padding:0 0 40px}
    .sec-label{
      font-size:11px;font-weight:600;letter-spacing:.6px;
      color:#6e6e73;text-transform:uppercase;
      padding:22px 16px 8px;
    }
    .card-list{
      background:#fff;border-radius:12px;
      margin:0 16px;overflow:hidden;
    }
    .card-item{
      display:flex;align-items:center;
      padding:13px 16px;
      border-bottom:.5px solid #e5e5ea;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      transition:background .1s;
    }
    .card-item:last-child{border-bottom:none}
    .card-item:active{background:#f2f2f7}
    .dot{width:10px;height:10px;border-radius:50%;margin-right:12px;flex-shrink:0}
    .card-text{flex:1;min-width:0}
    .card-title{font-size:15px;color:#1c1c1e;line-height:1.4}
    .card-ref{font-size:11px;color:#8e8e93;margin-top:2px}
    .card-count{font-size:12px;color:#8e8e93;margin-right:6px;white-space:nowrap}
    .chevron{color:#c7c7cc;font-size:16px;line-height:1}

    /* ── 詳細画面 ── */
    #detailView{display:none;padding:0 0 40px}
    .dh-box{
      background:#fff;margin:12px 16px;
      border-radius:12px;padding:14px 16px;
    }
    .dh-ref{font-size:12px;color:#8e8e93;margin-bottom:4px}
    .dh-title{font-size:18px;font-weight:700;color:#1c1c1e;line-height:1.3}
    .note-box{
      margin:0 16px 12px;
      font-size:13px;color:#3a3a3c;
      background:#fff8e1;border-radius:10px;
      padding:10px 14px;border-left:3px solid #ff9f0a;
      line-height:1.5;
    }
    .items-card{
      background:#fff;border-radius:12px;
      margin:0 16px;overflow:hidden;
    }
    .group-hd{
      font-size:12px;font-weight:700;
      color:#fff;padding:8px 16px;
    }
    .item-row{
      display:flex;align-items:flex-start;
      padding:11px 16px;
      border-bottom:.5px solid #e5e5ea;
    }
    .item-row:last-child{border-bottom:none}
    .item-num{
      font-size:13px;font-weight:600;
      min-width:26px;padding-top:1px;flex-shrink:0;
    }
    .item-text{font-size:15px;color:#1c1c1e;line-height:1.55}
    .term-row{
      padding:12px 16px;
      border-bottom:.5px solid #e5e5ea;
    }
    .term-row:last-child{border-bottom:none}
    .term-name{font-size:15px;font-weight:600;margin-bottom:5px;line-height:1.4}
    .term-desc{font-size:13px;color:#636366;line-height:1.55}
  </style>
</head>

/* ══════════════════════════════════════
   ユーティリティ
══════════════════════════════════════ */
function secColor(secId){
  const s = SECS.find(s=>s.id===secId);
  return s ? s.color : "#636366";
}
function itemCount(cat){
  let n=0;
  cat.items.forEach(it=>{
    if(typeof it==="string") n++;
    else if(it.type==="group") n+=it.items.length;
    else n++;
  });
  return n;
}

/* ══════════════════════════════════════
   インデックス描画
══════════════════════════════════════ */
function renderIndex(){
  let html="";
  SECS.forEach(sec=>{
    const cats = DATA.filter(d=>d.sec===sec.id);
    if(!cats.length) return;
    html+=`<div class="sec-label">${sec.label}</div><div class="card-list">`;
    cats.forEach(cat=>{
      const cnt = itemCount(cat);
      html+=`
        <div class="card-item" onclick="showDetail('${cat.id}')">
          <div class="dot" style="background:${sec.color}"></div>
          <div class="card-text">
            <div class="card-title">${cat.title}</div>
            <div class="card-ref">${cat.ref}</div>
          </div>
          <div class="card-count">${cnt}項目</div>
          <div class="chevron">›</div>
        </div>`;
    });
    html+=`</div>`;
  });
  document.getElementById("indexView").innerHTML=html;
}

/* ══════════════════════════════════════
   詳細画面描画
══════════════════════════════════════ */
function renderDetail(cat){
  const color = secColor(cat.sec);
  let html=`
    <div class="dh-box">
      <div class="dh-ref">${cat.ref}</div>
      <div class="dh-title">${cat.title}</div>
    </div>`;

  if(cat.note){
    html+=`<div class="note-box">📌 ${cat.note}</div>`;
  }

  html+=`<div class="items-card">`;
  let globalIdx=0;

  cat.items.forEach(it=>{
    if(typeof it==="string"){
      globalIdx++;
      html+=`<div class="item-row">
        <div class="item-num" style="color:${color}">${globalIdx}</div>
        <div class="item-text">${it}</div>
      </div>`;
    } else if(it.type==="group"){
      html+=`<div class="group-hd" style="background:${color}">${it.name}</div>`;
      it.items.forEach((sub,si)=>{
        html+=`<div class="item-row">
          <div class="item-num" style="color:${color}">${si+1}</div>
          <div class="item-text">${sub}</div>
        </div>`;
      });
    } else if(it.type==="term"){
      html+=`<div class="term-row">
        <div class="term-name" style="color:${color}">${it.name}</div>
        <div class="term-desc">${it.desc}</div>
      </div>`;
    }
  });

  html+=`</div>`;
  document.getElementById("detailView").innerHTML=html;
}

/* ══════════════════════════════════════
   ナビゲーション
══════════════════════════════════════ */
let savedScrollY = 0;

function showDetail(id){
  const cat = DATA.find(d=>d.id===id);
  if(!cat) return;
  savedScrollY = window.scrollY;
  renderDetail(cat);
  document.getElementById("indexView").style.display="none";
  document.getElementById("detailView").style.display="block";
  document.getElementById("backBtn").style.display="flex";
  document.getElementById("headerTitle").textContent=cat.title;
  window.scrollTo(0,0);
}

function showIndex(){
  document.getElementById("indexView").style.display="block";
  document.getElementById("detailView").style.display="none";
  document.getElementById("backBtn").style.display="none";
  document.getElementById("headerTitle").textContent="基準 例示一覧";
  window.scrollTo(0, savedScrollY);
}

/* ── スワイプで戻る ── */
(function(){
  let startX = 0, startY = 0, dragging = false;

  // スワイプ中に表示するオーバーレイ（詳細画面を左にスライド）
  const detail = document.getElementById("detailView");

  document.addEventListener("touchstart", function(e){
    const t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    dragging = false;
  }, {passive: true});

  document.addEventListener("touchmove", function(e){
    if(document.getElementById("detailView").style.display === "none") return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    // 左端20px以内から開始 かつ 横方向の動きが縦より大きい場合のみ
    if(!dragging && startX < 30 && Math.abs(dx) > Math.abs(dy) && dx > 0){
      dragging = true;
    }
    if(dragging && dx > 0){
      detail.style.transform = `translateX(${Math.min(dx, window.innerWidth)}px)`;
      detail.style.transition = "none";
    }
  }, {passive: true});

  document.addEventListener("touchend", function(e){
    if(!dragging) return;
    dragging = false;
    const dx = e.changedTouches[0].clientX - startX;
    if(dx > window.innerWidth * 0.35){
      // 35%以上スワイプで戻る
      detail.style.transition = "transform .25s ease";
      detail.style.transform = `translateX(${window.innerWidth}px)`;
      setTimeout(function(){
        detail.style.transform = "";
        detail.style.transition = "";
        showIndex();
      }, 250);
    } else {
      // 戻らない場合は元の位置に戻す
      detail.style.transition = "transform .2s ease";
      detail.style.transform = "translateX(0)";
      setTimeout(function(){
        detail.style.transform = "";
        detail.style.transition = "";
      }, 200);
    }
  }, {passive: true});
})();

/* ── 起動 ── */
renderIndex();
