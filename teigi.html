<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a3a">
<title>鑑定理論 定義の入れ子</title>
<style>
:root{
  --bg:#e9ecef; --panel:#fffef9; --ink:#22303d; --sub:#6b7280; --line:#d8d3c6;
  --accent:#2f5d8a; --red:#c0392b; --blue:#1f6fb2; --green:#2f7a55; --orange:#b4762a;
  --marker:rgba(255,214,0,.45); --mask:#cfd8e3;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 22px rgba(30,40,60,.10);
  --radius:14px; --maxw:860px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f1319; --panel:#1b212a; --ink:#e9e7e2; --sub:#9aa5b4; --line:#2f3845;
    --accent:#7fb0e0; --red:#ef8279; --blue:#79b6e8; --green:#63c497; --orange:#e0b063;
    --marker:rgba(255,214,0,.22); --mask:#3a4654;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  font-size:16px;line-height:1.85;-webkit-text-size-adjust:100%;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));}
button,input{font-family:inherit;color:inherit}
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--panel) 94%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{max-width:var(--maxw);margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.hd h1{font-size:16px;margin:0;font-weight:700;flex:1}
.hd .sub{display:block;font-size:11px;color:var(--sub);font-weight:400}
.iconbtn{background:none;border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap;text-decoration:none;color:inherit}
.iconbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wrap{max-width:var(--maxw);margin:0 auto;padding:14px}
.hidden{display:none!important}

.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tools input{flex:1;min-width:150px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px}
.chgroup{margin-bottom:14px}
.chname{font-size:12px;font-weight:700;color:var(--accent);margin:14px 0 6px 2px;letter-spacing:.06em}
.tlist{display:flex;flex-wrap:wrap;gap:7px}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 13px;
  font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn .s{font-size:10px;color:var(--orange);margin-left:5px}
.tbtn.r .s{color:var(--orange)}
.emptymsg{color:var(--sub);text-align:center;padding:36px 0;font-size:14px}

.crumb{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--sub);margin-bottom:10px}
.crumb button{background:none;border:none;color:var(--accent);font-size:11.5px;cursor:pointer;
  text-decoration:underline;padding:0}
.crumb .sep{color:var(--sub)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px 16px 20px}
.k{font-size:23px;font-weight:800;color:var(--red);line-height:1.35}
.srcchip{display:inline-block;font-size:10.5px;border-radius:999px;padding:1px 9px;margin-left:8px;vertical-align:middle;
  border:1px solid var(--accent);color:var(--accent);font-weight:700}
.srcchip.r{border-color:var(--orange);color:var(--orange)}
.srcchip.n{border-color:var(--sub);color:var(--sub)}
.tbtn.n .s{color:var(--sub)}
.tap{width:100%;margin:14px 0 0;padding:16px;border:2px dashed var(--line);border-radius:12px;
  background:none;color:var(--sub);font-size:13.5px;cursor:pointer}
.def{font-size:16px;line-height:2.0;margin-top:14px;border-top:2px solid var(--ink);padding-top:12px}
.def .nt{background:linear-gradient(transparent 62%, var(--marker) 62%);font-weight:700;cursor:pointer;
  border-bottom:1px dotted var(--accent)}
.sec{font-size:11.5px;font-weight:700;margin:16px 0 5px}
.sec.d{color:var(--accent)} .sec.u{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 11px;
  font-size:12.5px;font-weight:600;cursor:pointer;color:var(--accent);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips.u button{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%, transparent)}
.none{font-size:12.5px;color:var(--sub)}
.links{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px;padding-top:11px;border-top:1px dashed var(--line)}
.links a{font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--panel)}
.note{font-size:12px;color:var(--sub);line-height:1.7;margin-top:12px}

/* 一問一答モード */
.qbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qbar button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:5px 11px;font-size:12px;cursor:pointer;color:inherit}
.qbar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.qbar .sepline{flex-basis:100%;height:0}
.bar{height:4px;background:var(--line);border-radius:999px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--green);width:0}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px 16px 22px;text-align:center}
.qcard .qch{font-size:11.5px;color:var(--sub)}
.qcard .qk{font-size:26px;font-weight:800;color:var(--red);line-height:1.4;margin:6px 0 2px}
.qcard .qd{font-size:16.5px;line-height:1.95;text-align:left;margin:8px 0 2px}
.qcard .ask{font-size:12.5px;color:var(--sub);margin-top:10px}
.qcard .ansbox{margin-top:14px;border-top:2px solid var(--ink);padding-top:12px;text-align:left}
.qcard .ansbox .ak{font-size:22px;font-weight:800;color:var(--red);line-height:1.4}
.qcard .ansbox .ad{font-size:16px;line-height:1.95}
.qcard .srcchip{margin-left:6px}
.qstat{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px;font-size:12px;color:var(--sub)}
.qstat b{color:var(--ink)}
.qdone{text-align:center;padding:38px 10px;color:var(--sub)}
.qdone b{display:block;font-size:20px;color:var(--green);margin-bottom:8px}
.fnav button.ok{background:var(--green);border-color:var(--green);color:#fff}
.fnav button.mid{background:var(--orange);border-color:var(--orange);color:#fff}
.fnav button.ng{background:var(--red);border-color:var(--red);color:#fff}
.applinks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 0 8px}
.applinks a{font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px}
.fnav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--panel) 95%, transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.fnav .in{max-width:var(--maxw);margin:0 auto;display:flex;gap:8px;align-items:center}
.fnav button{flex:1;padding:12px 8px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:700;cursor:pointer}
.fnav button.prim{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<header>
  <div class="hd">
    <button class="iconbtn hidden" id="back">‹ 戻る</button>
    <a class="iconbtn" id="home" href="youten.html">‹ 板書</a>
    <h1>定義の入れ子<span class="sub" id="hsub">定義の中の「さらに定義が要る語」をたどる</span></h1>
    <button class="iconbtn" id="quizBtn">一問一答</button>
    <button class="iconbtn on" id="maskBtn">伏せる</button>
  </div>
</header>

<div class="wrap">
  <section id="v-list">
    <div class="tools"><input id="q" type="search" placeholder="用語を検索（例：正常価格、同一需給圏）"></div>
    <div id="list"></div>
    <div class="applinks">
      <a href="youten.html">章別 要点板書</a><a href="sojo.html">遡上ドリル</a><a href="kousei.html">答案構成チェック</a><a href="checkbook.html">暗記チェックブック</a><a href="index.html">一問一答</a>
    </div>
  </section>
  <section id="v-quiz" class="hidden">
    <div class="qbar" id="qdir"></div>
    <div class="qbar" id="qscope"></div>
    <div class="qbar" id="qch"></div>
    <div class="bar"><i id="qfill"></i></div>
    <div id="qbody"></div>
    <div class="qstat" id="qstat"></div>
  </section>
  <section id="v-term" class="hidden">
    <div class="crumb" id="crumb"></div>
    <div class="card" id="card"></div>
  </section>
</div>

<div class="fnav hidden" id="fnav"><div class="in" id="navin"></div></div>

<script src="teigi-data.js"></script>
<script src="youten-map.js"></script>
<script>
var T=window.TEIGI_DATA||[];
var $=function(s){return document.querySelector(s)};
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
var BY={}; T.forEach(function(e){ BY[e.k]=e; });
function srcCls(x){ return x==="留意事項"?"r":(x==="解説"?"n":""); }
function srcTag(x){ return x==="留意事項"?"留":(x==="解説"?"解":""); }
function srcNote(x){ return x==="基準"?"不動産鑑定評価基準（原文どおり）"
  :(x==="留意事項"?"不動産鑑定評価基準運用上の留意事項（原文どおり）"
  :"基準・留意事項の記述をもとにした整理（原文そのままではない）"); }
/* 逆引き：この語を定義の中で使っている語 */
var USEDBY={};
T.forEach(function(e){ (e.n||[]).forEach(function(o){ (USEDBY[o]=USEDBY[o]||[]).push(e.k); }); });

var LS="teigi_v1";
var st={mask:true, res:{}, qdir:"kd", qscope:"all", qch:null};
try{ var sv=JSON.parse(localStorage.getItem(LS)||"{}"); if(typeof sv.mask==="boolean") st.mask=sv.mask;
  if(sv.res) st.res=sv.res; if(sv.qdir) st.qdir=sv.qdir; if(sv.qscope) st.qscope=sv.qscope; if(sv.qch) st.qch=sv.qch;
}catch(e){}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(st)); }catch(e){} }

/* 章ラベル（板書カードIDから） */
function chOf(e){
  if(!e.card) return "その他";
  if(/^x/.test(e.card)) return "横断";
  if(/^k(\d)/.test(e.card)) return "各論第"+RegExp.$1+"章";
  var m=/^(\d+)/.exec(e.card); return m?"総論第"+m[1]+"章":"その他";
}
function chOrder(s){
  var m=/総論第(\d+)章/.exec(s); if(m) return +m[1];
  var k=/各論第(\d+)章/.exec(s); if(k) return 100+ +k[1];
  return 900;
}
function renderList(){
  var kw=($("#q").value||"").trim();
  var items=T.filter(function(e){ return !kw || e.k.indexOf(kw)>=0 || e.d.indexOf(kw)>=0; });
  var host=$("#list");
  if(!items.length){ host.innerHTML='<div class="emptymsg">該当する用語はありません。</div>'; return; }
  var g={};
  items.forEach(function(e){ var c=chOf(e); (g[c]=g[c]||[]).push(e); });
  host.innerHTML=Object.keys(g).sort(function(a,b){return chOrder(a)-chOrder(b);}).map(function(c){
    return '<div class="chgroup"><div class="chname">'+esc(c)+'　'+g[c].length+'語</div><div class="tlist">'
      +g[c].map(function(e){
         var cl=srcCls(e.src), tg=srcTag(e.src);
         return '<button class="tbtn'+(cl?" "+cl:"")+'" data-k="'+esc(e.k)+'">'+esc(e.k)
           +(tg?'<span class="s">'+tg+'</span>':'')+'</button>';
       }).join("")+'</div></div>';
  }).join("");
  $("#fnav").classList.add("hidden");
  $("#back").classList.add("hidden");
  $("#home").classList.remove("hidden");
}

/* ---------- 用語ビュー ---------- */
var path=[], revealed=false;
function openTerm(k,push){
  var e=BY[k]; if(!e) return;
  if(push===false) { /* パンくずから */ }
  else { path.push(k); }
  revealed=!st.mask;
  $("#v-list").classList.add("hidden");
  $("#v-quiz").classList.add("hidden");
  $("#v-term").classList.remove("hidden");
  $("#back").classList.remove("hidden");
  $("#home").classList.add("hidden");
  renderTerm();
  window.scrollTo(0,0);
}
function defHTML(e){
  /* 定義文のうち、入れ子用語をハイライトしてタップできるようにする */
  var d=esc(e.d), marks=(e.n||[]).slice().sort(function(a,b){return b.length-a.length;});
  var parts=[{t:d,lit:false}];
  marks.forEach(function(m){
    var em=esc(m), next=[];
    parts.forEach(function(p){
      if(p.lit){ next.push(p); return; }
      var seg=p.t.split(em);
      seg.forEach(function(s,i){
        if(i) next.push({t:em,lit:true,k:m});
        if(s) next.push({t:s,lit:false});
      });
    });
    parts=next;
  });
  return parts.map(function(p){
    return p.lit ? '<span class="nt" data-k="'+esc(p.k)+'">'+p.t+'</span>' : p.t;
  }).join("");
}
function renderTerm(){
  var k=path[path.length-1], e=BY[k];
  $("#crumb").innerHTML=path.map(function(x,i){
    return (i?'<span class="sep">›</span>':'')+'<button data-cr="'+i+'">'+esc(x)+'</button>';
  }).join("");
  var h='<div class="k">'+esc(e.k)+'<span class="srcchip '+srcCls(e.src)+'">'+esc(e.src)+'</span></div>';
  if(!revealed){
    h+='<button class="tap" id="rev">定義を声に出して言ってから、タップして確認</button>';
  }else{
    h+='<div class="def">'+defHTML(e)+'</div>';
    var nn=(e.n||[]).filter(function(x){return BY[x];});
    h+='<div class="sec d">↓ この定義の中で、さらに定義が要る語</div>';
    h+=nn.length?'<div class="chips">'+nn.map(function(x){return '<button data-k="'+esc(x)+'">'+esc(x)+'</button>';}).join("")+'</div>'
               :'<div class="none">この定義はこれ以上分解できません（末端）。</div>';
    var uu=(USEDBY[e.k]||[]).filter(function(x){return BY[x];});
    h+='<div class="sec u">↑ この語を定義の中で使っている語</div>';
    h+=uu.length?'<div class="chips u">'+uu.map(function(x){return '<button data-k="'+esc(x)+'">'+esc(x)+'</button>';}).join("")+'</div>'
               :'<div class="none">ありません。</div>';
    var ls=[];
    if(e.card) ls.push('<a href="youten.html#c='+encodeURIComponent(e.card)+'">要点板書で見る</a>');
    if(e.q) ls.push('<a href="checkbook.html#q='+encodeURIComponent(e.q)+'">暗記チェックブック '+esc(e.q)+'</a>');
    if(ls.length) h+='<div class="links">'+ls.join("")+'</div>';
    h+='<div class="note">出典：'+srcNote(e.src)+'</div>';
  }
  $("#card").innerHTML=h;
  if(!revealed){ $("#rev").onclick=function(){ revealed=true; renderTerm(); }; }
  $("#fnav").classList.remove("hidden");
  $("#navin").innerHTML=(path.length>1?'<button id="up">‹ 1つ上へ</button>':'')
    +'<button id="tolist" class="prim">用語一覧</button>';
  var up=$("#up"); if(up) up.onclick=function(){ path.pop(); renderTerm(); window.scrollTo(0,0); };
  $("#tolist").onclick=toList;
}
function toList(){
  path=[];
  $("#v-term").classList.add("hidden");
  $("#v-quiz").classList.add("hidden");
  $("#v-list").classList.remove("hidden");
  $("#quizBtn").classList.remove("on");
  renderList(); window.scrollTo(0,0);
}

/* ================= 一問一答モード ================= */
var deck=[], qpos=0, qshown=false;
function chList(){
  var s={}; T.forEach(function(e){ var c=chOf(e); s[c]=(s[c]||0)+1; });
  return Object.keys(s).sort(function(a,b){return chOrder(a)-chOrder(b);}).map(function(k){return [k,s[k]];});
}
function qpool(){
  var p=T.slice();
  if(st.qch) p=p.filter(function(e){ return chOf(e)===st.qch; });
  if(st.qscope==="weak") p=p.filter(function(e){ var r=st.res[e.k]; return !r || r.last!=="o"; });
  if(st.qscope==="new")  p=p.filter(function(e){ return !st.res[e.k]; });
  return p;
}
function buildDeck(){
  deck=qpool().map(function(e){return {e:e,r:Math.random()};}).sort(function(a,b){return a.r-b.r;}).map(function(x){return x.e;});
  qpos=0; qshown=false;
}
function toQuiz(rebuild){
  $("#v-list").classList.add("hidden");
  $("#v-term").classList.add("hidden");
  $("#v-quiz").classList.remove("hidden");
  $("#back").classList.add("hidden");
  $("#home").classList.remove("hidden");
  $("#quizBtn").classList.add("on");
  if(rebuild!==false) buildDeck();
  renderQuiz(); window.scrollTo(0,0);
}
function qctl(){
  $("#qdir").innerHTML='<button data-qd="kd"'+(st.qdir==="kd"?' class="on"':'')+'>用語 → 定義</button>'
    +'<button data-qd="dk"'+(st.qdir==="dk"?' class="on"':'')+'>定義 → 用語</button>';
  var sc=[["all","すべて"],["weak","苦手のみ"],["new","未着手のみ"]];
  $("#qscope").innerHTML=sc.map(function(x){
    return '<button data-qs="'+x[0]+'"'+(st.qscope===x[0]?' class="on"':'')+'>'+x[1]+'</button>';
  }).join("")+'<button id="qreset">記録リセット</button>';
  $("#qch").innerHTML='<button data-qc=""'+(st.qch?'':' class="on"')+'>章で絞らない</button>'
    +chList().map(function(p){
       return '<button data-qc="'+esc(p[0])+'"'+(st.qch===p[0]?' class="on"':'')+'>'+esc(p[0])+' '+p[1]+'</button>';
     }).join("");
}
function renderQuiz(){
  qctl();
  var host=$("#qbody");
  if(qpos>=deck.length){
    host.innerHTML='<div class="qdone"><b>'+(deck.length?"1周おわり":"対象なし")+'</b>'
      +(deck.length?'範囲を変えるか、「苦手のみ」でもう一周してください。':'この範囲に用語がありません。')+'</div>';
    $("#qfill").style.width="100%"; $("#fnav").classList.add("hidden"); qstat(); return;
  }
  var e=deck[qpos];
  var h='<div class="qcard"><div class="qch">'+esc(chOf(e))+'</div>';
  if(st.qdir==="kd"){
    h+='<div class="qk">'+esc(e.k)+'<span class="srcchip '+srcCls(e.src)+'">'+esc(e.src)+'</span></div>'
      +'<div class="ask">定義を声に出して言う</div>';
    if(qshown) h+='<div class="ansbox"><div class="ad">'+esc(e.d)+'</div></div>';
  }else{
    h+='<div class="qd">'+esc(e.d)+'</div><div class="ask">この定義の用語は？</div>';
    if(qshown) h+='<div class="ansbox"><div class="ak">'+esc(e.k)+'<span class="srcchip '+srcCls(e.src)+'">'+esc(e.src)+'</span></div></div>';
  }
  if(qshown){
    h+='<div class="links">'
      +'<a href="#" id="qnest">定義の入れ子で開く ›</a>'
      +(e.card?'<a href="youten.html#c='+encodeURIComponent(e.card)+'">要点板書</a>':'')
      +(e.q?'<a href="checkbook.html#q='+encodeURIComponent(e.q)+'">'+esc(e.q)+'</a>':'')
      +'</div>';
  }
  h+='</div>';
  host.innerHTML=h;
  $("#qfill").style.width=Math.round(100*qpos/Math.max(1,deck.length))+"%";
  var nz=$("#qnest"); if(nz) nz.onclick=function(ev){ ev.preventDefault(); openTerm(e.k); };
  qnav(); qstat();
}
function qnav(){
  var n=$("#navin"); $("#fnav").classList.remove("hidden");
  if(!qshown){
    n.innerHTML='<button id="qskip">スキップ</button><button id="qshow" class="prim">答えを見る</button>';
    $("#qshow").onclick=function(){ qshown=true; renderQuiz(); };
    $("#qskip").onclick=function(){ qgrade(null); };
  }else{
    n.innerHTML='<button class="ok" data-qg="o">○ 言えた</button><button class="mid" data-qg="m">△ あやしい</button><button class="ng" data-qg="x">× 言えず</button>';
  }
}
function qgrade(g){
  var e=deck[qpos];
  if(g&&e){
    var r=st.res[e.k]||{o:0,m:0,x:0};
    r[g]=(r[g]||0)+1; r.last=g; r.t=Date.now();
    st.res[e.k]=r; save();
    if(g!=="o") deck.push(e);
  }
  qpos++; qshown=false; renderQuiz(); window.scrollTo(0,0);
}
function qstat(){
  var ids=Object.keys(st.res), o=0, tot=0;
  ids.forEach(function(k){ var r=st.res[k]; o+=r.o||0; tot+=(r.o||0)+(r.m||0)+(r.x||0); });
  var ok=ids.filter(function(k){return st.res[k].last==="o";}).length;
  $("#qstat").innerHTML='出題 <b>'+deck.length+'</b> 語　／　直近○ <b>'+ok+'</b> 語　／　のべ <b>'+tot+'</b> 回（○ '+(tot?Math.round(100*o/tot):0)+'%）　／　残り <b>'+Math.max(0,deck.length-qpos)+'</b>';
}

document.addEventListener("click",function(ev){
  var t=ev.target;
  var qd=t.closest&&t.closest("[data-qd]");
  if(qd){ st.qdir=qd.getAttribute("data-qd"); save(); qshown=false; renderQuiz(); return; }
  var qs=t.closest&&t.closest("[data-qs]");
  if(qs){ st.qscope=qs.getAttribute("data-qs"); save(); toQuiz(); return; }
  var qc=t.closest&&t.closest("[data-qc]");
  if(qc){ var v=qc.getAttribute("data-qc"); st.qch=v||null; save(); toQuiz(); return; }
  if(t.id==="qreset"){ if(confirm("一問一答の成績をすべて消しますか？")){ st.res={}; save(); toQuiz(); } return; }
  var qg=t.closest&&t.closest("[data-qg]");
  if(qg){ qgrade(qg.getAttribute("data-qg")); return; }
  var cr=t.closest&&t.closest("[data-cr]");
  if(cr){ path=path.slice(0,+cr.getAttribute("data-cr")+1); revealed=!st.mask; renderTerm(); window.scrollTo(0,0); return; }
  var b=t.closest&&t.closest("[data-k]");
  if(b){ openTerm(b.getAttribute("data-k")); return; }
});
$("#back").onclick=function(){
  if(path.length>1){ path.pop(); renderTerm(); window.scrollTo(0,0); return; }
  toList();
};
$("#q").oninput=renderList;
$("#maskBtn").onclick=function(){
  st.mask=!st.mask; save();
  this.classList.toggle("on",st.mask);
  this.textContent=st.mask?"伏せる":"そのまま";
  if(path.length){ revealed=!st.mask; renderTerm(); }
};
$("#quizBtn").onclick=function(){
  if($("#v-quiz").classList.contains("hidden")) toQuiz(); else toList();
};
$("#maskBtn").classList.toggle("on",st.mask);
$("#maskBtn").textContent=st.mask?"伏せる":"そのまま";

if(!T.length){ $("#list").innerHTML='<div class="emptymsg">データ（teigi-data.js）が読み込めませんでした。</div>'; }
else {
  renderList();
  var mh=/^#t=(.+)$/.exec(location.hash||"");
  if(mh){ var k=decodeURIComponent(mh[1]);
    try{ history.replaceState(null,"",location.pathname); }catch(e){}
    if(BY[k]) openTerm(k);
  }
}
</script>
</body>
</html>
