<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a3a">
<title>鑑定理論 章別 要点板書</title>
<style>
:root{
  --bg:#e9ecef; --board:#fffef9; --ink:#22303d; --sub:#6b7280; --line:#d8d3c6;
  --accent:#2f5d8a; --red:#c0392b; --blue:#1f6fb2; --green:#2f7a55; --orange:#b4762a;
  --marker:rgba(255,214,0,.45); --mask:#cfd8e3;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 22px rgba(30,40,60,.10);
  --radius:14px; --maxw:860px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1319; --board:#1b212a; --ink:#e9e7e2; --sub:#9aa5b4; --line:#2f3845;
    --accent:#7fb0e0; --red:#ef8279; --blue:#79b6e8; --green:#63c497; --orange:#e0b063;
    --marker:rgba(255,214,0,.22); --mask:#3a4654;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  font-size:16px; line-height:1.85; -webkit-text-size-adjust:100%;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
button,input,select{font-family:inherit;color:inherit}

header{
  position:sticky; top:0; z-index:50;
  background:color-mix(in srgb,var(--board) 94%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top);
}
.hd{max-width:var(--maxw);margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.hd h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em;flex:1}
.hd .sub{display:block;font-size:11px;color:var(--sub);font-weight:400;letter-spacing:0}
.iconbtn{background:none;border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.iconbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wrap{max-width:var(--maxw);margin:0 auto;padding:14px}

/* ---------- index ---------- */
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tools input{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--board);font-size:14px}
.partlabel{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.14em;margin:18px 0 8px 2px}
.chgroup{margin-bottom:14px}
.chname{font-size:13px;font-weight:700;color:var(--accent);margin:0 0 6px 2px}
.card{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--board);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;
}
.card:active{transform:scale(.995)}
.card .ttl{flex:1;font-size:15px;font-weight:600;line-height:1.5}
.card .sec{display:block;font-size:11px;color:var(--sub);font-weight:400}
.chip{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--sub);white-space:nowrap}
.chip.n{color:var(--orange);border-color:var(--orange)}
.chip.hot{color:var(--red);border-color:var(--red)}
.chip.done{color:var(--green);border-color:var(--green)}
.emptymsg{color:var(--sub);text-align:center;padding:40px 0;font-size:14px}

/* ---------- board ---------- */
.board{
  background:var(--board);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:18px 16px 22px;position:relative;
}
.bhead{border-bottom:2.5px solid var(--ink);padding-bottom:8px;margin-bottom:14px}
.bhead .ch{font-size:12px;color:var(--sub)}
.bhead .t{font-size:20px;font-weight:800;color:var(--red);letter-spacing:.02em;margin-top:2px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bhead .t .num{font-size:12px;color:var(--orange);border:1.5px solid var(--orange);border-radius:999px;padding:0 8px;font-weight:700}
.bhead .secname{font-size:12px;color:var(--accent);font-weight:600;margin-top:3px}

.row{margin:10px 0}
.r-h{font-size:17px;font-weight:800;color:var(--red);border-left:5px solid var(--red);padding-left:9px;margin:18px 0 8px}
.r-b{display:flex;gap:8px;align-items:flex-start}
.r-b .dot{color:var(--ink);font-weight:800;flex:none;line-height:1.85}
.r-b .tx{flex:1}
.memo{display:block;color:var(--blue);font-size:12.5px;line-height:1.6;margin-top:2px}
.memo:before{content:"→ "}
.r-grp{display:flex;gap:9px;align-items:stretch;margin:12px 0}
.r-grp .lab{flex:none;font-size:12.5px;width:84px;font-weight:700;color:var(--orange);writing-mode:horizontal-tb;align-self:center;max-width:92px;line-height:1.4}
.r-grp .brace{flex:none;width:11px;border:2px solid var(--ink);border-right:none;border-radius:7px 0 0 7px}
.r-grp ul{list-style:none;margin:0;padding:0;flex:1}
.r-grp li{margin:2px 0;font-size:15px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.r-grp li .im{color:var(--blue);font-size:12px;border:1px dashed var(--blue);border-radius:6px;padding:0 6px;line-height:1.7;white-space:nowrap}
.r-pair{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0;font-size:15px}
.r-pair .seg{background:color-mix(in srgb,var(--accent) 10%, transparent);border:1px solid color-mix(in srgb,var(--accent) 35%, transparent);border-radius:8px;padding:2px 9px}
.r-pair .arw{color:var(--accent);font-weight:800}
.r-warn{border:2px solid var(--red);border-radius:10px;padding:8px 11px;margin:12px 0;font-size:14.5px;background:color-mix(in srgb,var(--red) 7%, transparent)}
.r-warn:before{content:"注意 ";font-weight:800;color:var(--red);font-size:12px}
.r-memo{font-size:13.5px;color:var(--blue);border-left:3px dotted var(--blue);padding-left:9px;margin:12px 0}
.r-memo:before{content:"※ "}
.tbl{margin:12px 0;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.tbl .cap{font-size:12px;font-weight:700;background:color-mix(in srgb,var(--ink) 8%, transparent);padding:4px 10px;color:var(--sub)}
.tbl .tr{display:flex;border-top:1px solid var(--line)}
.tbl .td1{flex:none;width:34%;padding:7px 9px;font-weight:700;font-size:14px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--ink) 3%, transparent)}
.tbl .td2{flex:1;padding:7px 9px;font-size:14.5px}
@media (max-width:460px){ .tbl .td1{width:30%} .r-grp .lab{max-width:72px;font-size:11.5px} }

/* 伏せ字 */
.kw{background:linear-gradient(transparent 62%, var(--marker) 62%);font-weight:700;border-radius:2px}
body.hide .kw{background:var(--mask);color:transparent;border-radius:4px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 20%, transparent);cursor:pointer}
body.hide .kw.open{background:linear-gradient(transparent 62%, var(--marker) 62%);color:inherit;box-shadow:none}

/* 起点キーワード */
.r-key{border:2.5px solid var(--red);border-radius:12px;padding:10px 12px;margin:6px 0 14px;
  font-size:16px;font-weight:800;color:var(--red);background:color-mix(in srgb,var(--red) 6%, transparent);text-align:center}
/* 流れのノード */
.r-step{display:flex;gap:10px;margin:0;position:relative}
.r-step .rail{flex:none;width:22px;display:flex;flex-direction:column;align-items:center}
.r-step .num{width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;margin-top:4px}
.r-step .line{flex:1;width:2px;background:color-mix(in srgb,var(--accent) 40%, transparent);margin:2px 0}
.r-step .body{flex:1;padding:2px 0 14px}
.r-step .shead{font-size:14px;font-weight:700;color:var(--accent);display:inline-flex;align-items:center;gap:4px;
  border-bottom:1px dashed color-mix(in srgb,var(--accent) 55%, transparent);cursor:pointer}
.r-step .shead:after{content:"›";font-weight:800}
.r-step .stx{font-size:15px;margin-top:2px}
.r-step:last-child .line{display:none}
/* 他章とのつながり */
.r-links{border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;margin:16px 0 4px;
  background:color-mix(in srgb,var(--accent) 5%, transparent)}
.r-links .cap{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px}
.r-links .li{display:flex;gap:7px;align-items:flex-start;margin:5px 0;font-size:14px}
.r-links .lk{flex:none;color:var(--accent);font-weight:700;cursor:pointer;border-bottom:1px dashed currentColor;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.r-links .lw{flex:1;color:var(--ink)}
/* 階層マップ（上位⇄下位） */
.hier{border:1.5px solid var(--green);border-radius:12px;margin:0 0 12px;overflow:hidden;
  background:color-mix(in srgb,var(--green) 5%, transparent)}
.hier .hcap{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--green);
  padding:6px 10px;border-bottom:1px solid color-mix(in srgb,var(--green) 30%, transparent);cursor:pointer}
.hier .hcap .sp{flex:1;font-weight:400;color:var(--sub)}
.hier .hcap .cv{font-weight:800}
.hier .hbody{padding:6px 10px 9px}
.hier.closed .hbody{display:none}
.hrow{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.hrow .dir{flex:none;width:52px;font-size:11.5px;font-weight:700;line-height:1.5;padding-top:3px}
.hrow.up .dir{color:var(--red)} .hrow.sib .dir{color:var(--orange)} .hrow.down .dir{color:var(--accent)}
.hrow .hitems{flex:1;display:flex;flex-direction:column;gap:4px}
.hitem{display:flex;gap:6px;align-items:flex-start;font-size:13.5px;line-height:1.6}
.hitem .hk{flex:none;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border:1px solid var(--line);background:var(--board);border-radius:999px;padding:1px 9px;
  font-size:12px;font-weight:700;cursor:pointer;color:var(--accent)}
.hrow.up .hitem .hk{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%, transparent)}
.hrow.sib .hitem .hk{color:var(--orange);border-color:color-mix(in srgb,var(--orange) 45%, transparent)}
.hitem .hw{flex:1;color:var(--ink)}
.hroot{font-size:12.5px;color:var(--sub);padding:2px 0}
/* 書き出しの型 */
.lead{border-left:4px solid var(--orange);background:color-mix(in srgb,var(--orange) 6%, transparent);
  border-radius:0 10px 10px 0;padding:8px 11px;margin:0 0 14px}
.lead .lcap{font-size:11.5px;font-weight:700;color:var(--orange);margin-bottom:3px}
.lead ol{margin:0;padding-left:1.25em}
.lead li{font-size:13.5px;line-height:1.75;margin:3px 0}
@media (max-width:460px){ .hrow .dir{width:48px;font-size:11px} .hitem .hk{max-width:100%} }
/* タグ */
.tagbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.tagbar::-webkit-scrollbar{display:none}
.tag{flex:none;font-size:12px;border:1px solid var(--line);background:var(--board);color:var(--sub);
  border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.tag.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.btags .tag{font-size:11px;padding:3px 9px}
.refs{margin-top:16px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--sub);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.refs a{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:1px 8px}

/* ---------- footer nav ---------- */
.fnav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:color-mix(in srgb,var(--board) 95%, transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
}
.fnav .in{max-width:var(--maxw);margin:0 auto;display:flex;gap:8px;align-items:center}
.fnav button{flex:1;padding:11px 8px;border-radius:11px;border:1px solid var(--line);background:var(--board);font-size:14px;font-weight:700;cursor:pointer}
.fnav button.prim{background:var(--green);border-color:var(--green);color:#fff}
.fnav button.prim.off{background:var(--board);color:var(--sub);border-color:var(--line)}
.pos{font-size:12px;color:var(--sub);white-space:nowrap;padding:0 4px}
.applinks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0 8px}
.applinks a{font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--board);border-radius:999px;padding:5px 12px}
.hidden{display:none!important}
.back{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;padding:4px 0}
@media print{
  header,.fnav,.tools{display:none!important}
  body{background:#fff;padding:0}
  .board{box-shadow:none;page-break-after:always}
  body.hide .kw{background:none;color:inherit;box-shadow:none}
}
</style>
</head>
<body>
<header>
  <div class="hd">
    <button class="back hidden" id="back">‹ 一覧</button>
    <h1>鑑定理論 章別 要点板書<span class="sub" id="hsub">総論1〜9章・各論1〜3章＋横断10枚（論証の型）</span></h1>
    <button class="iconbtn" id="maskBtn">暗記</button>
  </div>
</header>

<div class="wrap">
  <div id="indexView">
    <div class="tools">
      <input id="q" type="search" placeholder="キーワード検索（例：調査範囲、還元利回り）">
      <button class="iconbtn" id="hotBtn">頻出のみ</button>
      <button class="iconbtn" id="todoBtn">未チェック</button>
    </div>
    <div class="tagbar" id="tagbar"></div>
    <div id="list"></div>
    <div class="applinks">
      <a href="sojo.html">遡上ドリル</a><a href="kousei.html">答案構成チェック</a><a href="teigi.html">定義の入れ子</a><a href="index.html">一問一答</a><a href="checkbook.html">暗記チェックブック</a><a href="ronbun.html">論文チェックブック</a><a href="anki.html">穴埋め暗記</a><a href="reiji.html">例示一覧</a><a href="omomi.html">重み付け</a>
    </div>
  </div>

  <div id="boardView" class="hidden">
    <div class="board" id="board"></div>
  </div>
</div>

<div class="fnav hidden" id="fnav">
  <div class="in">
    <button id="prev">‹ 前</button>
    <span class="pos" id="pos"></span>
    <button id="done" class="prim">覚えた</button>
    <button id="next">次 ›</button>
  </div>
</div>

<script src="youten-data.js"></script>
<script>
var DATA = window.YOUTEN_DATA || [];
var $=function(s){return document.querySelector(s)};
var LS="youten_v1";
var state={done:{},mask:false,hot:false,todo:false,tag:null,hclose:false};
try{ var sv=JSON.parse(localStorage.getItem(LS)||"{}"); if(sv&&sv.done) state.done=sv.done; if(sv&&sv.mask) state.mask=!!sv.mask; if(sv&&sv.hclose) state.hclose=!!sv.hclose; }catch(e){}
function save(){ try{ localStorage.setItem(LS, JSON.stringify({done:state.done,mask:state.mask,hclose:state.hclose})); }catch(e){} }

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
/* 【…】→ マーカー／伏せ字 */
function kw(s){ return esc(s).replace(/【([^】]*)】/g,'<span class="kw">$1</span>'); }
function plain(s){ return String(s).replace(/[【】]/g,""); }

/* ---------- 一覧 ---------- */
var view="index", cur=0, deck=[];

function filtered(){
  var t=($("#q").value||"").trim();
  return DATA.filter(function(c){
    if(state.hot && !c.hot) return false;
    if(state.todo && state.done[c.id]) return false;
    if(state.tag && !((c.tags||[]).indexOf(state.tag)>=0)) return false;
    if(!t) return true;
    var hay=[c.ch,c.sec,c.title,(c.tags||[]).join(' ')].concat((c.rows||[]).map(function(r){
      var a=[];
      if(r.v) a.push(Array.isArray(r.v)?r.v.join(" "):r.v);
      if(r.m) a.push(r.m); if(r.label) a.push(r.label); if(r.head) a.push(r.head);
      (r.items||[]).forEach(function(it){ a.push(Array.isArray(it)?it.join(" "):((it.v||"")+" "+(it.m||"")+" "+(it.head||""))); });
      return a.join(" ");
    })).join(" ");
    return plain(hay).indexOf(t)>=0;
  });
}
function renderTagbar(){
  var counts={};
  DATA.forEach(function(c){ (c.tags||[]).forEach(function(t){ counts[t]=(counts[t]||0)+1; }); });
  var tags=Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]||a.localeCompare(b,'ja'); });
  var host=$("#tagbar"); host.innerHTML="";
  var all=document.createElement("button");
  all.className="tag"+(state.tag?"":" on"); all.textContent="すべて";
  all.onclick=function(){ state.tag=null; renderTagbar(); renderIndex(); };
  host.appendChild(all);
  tags.forEach(function(t){
    var b=document.createElement("button");
    b.className="tag"+(state.tag===t?" on":""); b.textContent=t+" "+counts[t];
    b.onclick=function(){ state.tag=(state.tag===t?null:t); renderTagbar(); renderIndex(); };
    host.appendChild(b);
  });
}
function renderIndex(){
  deck=filtered();
  var host=$("#list"); host.innerHTML="";
  if(!deck.length){ host.innerHTML='<div class="emptymsg">該当する板書はありません。</div>'; return; }
  var lastPart="", lastCh="", chBox=null;
  deck.forEach(function(c,i){
    if(c.part!==lastPart){
      lastPart=c.part; lastCh="";
      var p=document.createElement("div"); p.className="partlabel"; p.textContent=c.part; host.appendChild(p);
    }
    if(c.ch!==lastCh){
      lastCh=c.ch;
      var g=document.createElement("div"); g.className="chgroup";
      var h=document.createElement("div"); h.className="chname"; h.textContent=c.ch; g.appendChild(h);
      host.appendChild(g); chBox=g;
    }
    var b=document.createElement("button"); b.className="card";
    b.innerHTML='<span class="ttl">'+esc(c.title)+(c.sec?'<span class="sec">'+esc(c.sec)+'</span>':'')+'</span>'
      +(c.n?'<span class="chip n">'+esc(c.n)+'</span>':'')
      +(c.hot?'<span class="chip hot">頻出</span>':'')
      +(state.done[c.id]?'<span class="chip done">✓</span>':'');
    b.onclick=function(){ open(i); };
    chBox.appendChild(b);
  });
}

/* ---------- 板書 ---------- */
function rowHTML(r,ctx){
  switch(r.type||r.t){
    case "key": return '<div class="r-key">'+kw(r.v)+'</div>';
    case "step":
      ctx.n=(ctx.n||0)+1;
      return '<div class="r-step"><div class="rail"><span class="num">'+ctx.n+'</span><span class="line"></span></div>'
        +'<div class="body">'+(r.to?'<span class="shead" data-go="'+esc(r.to)+'">'+kw(r.head||"")+'</span>':'<span class="shead" style="cursor:default;border:none">'+kw(r.head||"")+'</span>')
        +'<div class="stx">'+kw(r.v||"")+'</div>'+(r.m?'<div class="memo">'+kw(r.m)+'</div>':'')+'</div></div>';
    case "links":
      return '<div class="r-links"><div class="cap">'+esc(r.label||"他章とのつながり")+'</div>'
        +(r.items||[]).map(function(it){
           return '<div class="li"><span class="lk" data-go="'+esc(it.to)+'">'+esc(it.head)+'</span><span class="lw">'+kw(it.v)+'</span></div>';
         }).join("")+'</div>';
    case "h": return '<div class="r-h">'+kw(r.v)+'</div>';
    case "warn": return '<div class="r-warn">'+kw(r.v)+'</div>';
    case "memo": return '<div class="r-memo">'+kw(r.v)+'</div>';
    case "pair":
      return '<div class="r-pair">'+r.v.map(function(x,i){
        return (i?'<span class="arw">→</span>':'')+'<span class="seg">'+kw(x)+'</span>';
      }).join("")+'</div>';
    case "grp":
      return '<div class="r-grp">'
        +(r.label?'<div class="lab">'+kw(r.label)+'</div>':'')
        +'<div class="brace"></div><ul>'
        + (r.items||[]).map(function(it){
            return '<li><span>・'+kw(it.v)+'</span>'+(it.m?'<span class="im">'+kw(it.m)+'</span>':'')+'</li>';
          }).join("")
        +'</ul></div>'
        +(r.m?'<div class="r-memo">'+kw(r.m)+'</div>':'');
    case "tbl":
      return '<div class="tbl">'+(r.label?'<div class="cap">'+kw(r.label)+'</div>':'')
        +(r.items||[]).map(function(p){
            return '<div class="tr"><div class="td1">'+kw(p[0])+'</div><div class="td2">'+kw(p[1])+'</div></div>';
          }).join("")+'</div>';
    default:
      return '<div class="row r-b"><span class="dot">・</span><span class="tx">'+kw(r.v)
        +(r.m?'<span class="memo">'+kw(r.m)+'</span>':'')+'</span></div>';
  }
}
function hdir(cls,label,items){
  if(!items||!items.length) return "";
  return '<div class="hrow '+cls+'"><span class="dir">'+label+'</span><div class="hitems">'
    +items.map(function(it){
        return '<div class="hitem"><span class="hk" data-go="'+esc(it.to)+'">'+esc(it.head)+'</span>'
          +'<span class="hw">'+kw(it.v||"")+'</span></div>';
      }).join("")+'</div></div>';
}
function hierHTML(c){
  var hi=c.hier; if(!hi) return "";
  var body=(hi.root?'<div class="hroot">'+esc(hi.root)+'</div>':"")
    + hdir("up","↑ 上位",hi.up)
    + hdir("sib","→ 兄弟",hi.sib)
    + hdir("down","↓ 下位",hi.down);
  var out="";
  if(body){
    out+='<div class="hier'+(state.hclose?" closed":"")+'" id="hierBox">'
      +'<div class="hcap" id="hierCap"><span class="cv">'+(state.hclose?"▸":"▾")+'</span>階層マップ'
      +'<span class="sp">上位＝属／兄弟＝同じ分類／下位＝定義の入れ子</span></div>'
      +'<div class="hbody">'+body+'</div></div>';
  }
  if(hi.lead&&hi.lead.length){
    out+='<div class="lead"><div class="lcap">書き出しの型（属 → 位置 → 対象）</div><ol>'
      +hi.lead.map(function(x){return '<li>'+kw(x)+'</li>';}).join("")+'</ol></div>';
  }
  return out;
}
function renderBoard(){
  var c=deck[cur]; if(!c) return;
  var h='<div class="bhead"><div class="ch">'+esc(c.part)+'　'+esc(c.ch)+'</div>'
    +'<div class="t">'+esc(c.title)+(c.n?'<span class="num">'+esc(c.n)+'</span>':'')+(c.hot?'<span class="chip hot">頻出</span>':'')+'</div>'
    +(c.sec?'<div class="secname">'+esc(c.sec)+'</div>':'')
    +((c.tags&&c.tags.length)?'<div class="btags">'+c.tags.map(function(t){return '<button class="tag" data-tag="'+esc(t)+'">'+esc(t)+'</button>';}).join("")+'</div>':'')
    +'</div>';
  h+=hierHTML(c);
  var ctx={};
  h+=(c.rows||[]).map(function(r){return rowHTML(r,ctx);}).join("");
  if(c.refs&&c.refs.length){
    h+='<div class="refs"><span>暗記チェックブック：</span>'
      +c.refs.map(function(q){return '<a href="checkbook.html#q='+encodeURIComponent(q)+'">'+esc(q)+'</a>';}).join("")+'</div>';
  }
  if(c.ron&&c.ron.length){
    h+='<div class="refs"><span>論文チェックブック：</span>'
      +c.ron.map(function(n){return '<a href="ronbun.html#q='+n+'">問題'+n+'</a>';}).join("")+'</div>';
  }
  $("#board").innerHTML=h;
  $("#pos").textContent=(cur+1)+" / "+deck.length;
  var d=$("#done"); d.textContent=state.done[c.id]?"✓ 覚えた":"覚えた";
  d.classList.toggle("off", !state.done[c.id]);
  window.scrollTo(0,0);
}
var hist=[];
function openById(id,push){
  var i=deck.findIndex(function(c){return c.id===id;});
  if(i<0){ /* 絞り込みで外れている場合は解除してから開く */
    state.tag=null; state.hot=false; state.todo=false; $("#q").value="";
    $("#hotBtn").classList.remove("on"); $("#todoBtn").classList.remove("on");
    deck=filtered(); renderTagbar();
    i=deck.findIndex(function(c){return c.id===id;});
  }
  if(i<0) return;
  if(push!==false && view==="board" && deck[cur]) hist.push(deck[cur].id);
  open(i,true);
}
function open(i,keepHist){
  if(!keepHist) hist=[];
  cur=i; view="board";
  $("#indexView").classList.add("hidden");
  $("#boardView").classList.remove("hidden");
  $("#fnav").classList.remove("hidden");
  $("#back").classList.remove("hidden");
  $("#hsub").textContent="板書を上から順に追って、口に出して言えるかを確認";
  renderBoard();
}
function toIndex(){
  view="index";
  $("#indexView").classList.remove("hidden");
  $("#boardView").classList.add("hidden");
  $("#fnav").classList.add("hidden");
  $("#back").classList.add("hidden");
  $("#hsub").textContent="総論1〜9章・各論1〜3章＋横断10枚（論証の型）";
  renderTagbar(); renderIndex(); window.scrollTo(0,0);
}
function move(d){ var n=cur+d; if(n<0||n>=deck.length) return; cur=n; renderBoard(); }

/* ---------- events ---------- */
$("#back").onclick=function(){
  if(hist.length){ var id=hist.pop(); openById(id,false); return; }
  toIndex();
};
$("#prev").onclick=function(){move(-1)};
$("#next").onclick=function(){move(1)};
$("#done").onclick=function(){
  var c=deck[cur]; if(!c) return;
  if(state.done[c.id]) delete state.done[c.id]; else state.done[c.id]=1;
  save(); renderBoard();
};
$("#q").oninput=renderIndex;
$("#hotBtn").onclick=function(){ state.hot=!state.hot; this.classList.toggle("on",state.hot); renderIndex(); };
$("#todoBtn").onclick=function(){ state.todo=!state.todo; this.classList.toggle("on",state.todo); renderIndex(); };
function applyMask(){
  document.body.classList.toggle("hide", state.mask);
  $("#maskBtn").classList.toggle("on", state.mask);
  $("#maskBtn").textContent=state.mask?"暗記中":"暗記";
}
$("#maskBtn").onclick=function(){ state.mask=!state.mask; save(); applyMask(); };
document.addEventListener("click",function(e){
  var t=e.target;
  var go=t.closest?t.closest("[data-go]"):null;
  if(go){ e.preventDefault(); openById(go.getAttribute("data-go"),true); return; }
  if(t.closest&&t.closest("#hierCap")){
    state.hclose=!state.hclose; save();
    var bx=document.getElementById("hierBox");
    if(bx){ bx.classList.toggle("closed",state.hclose); var cv=bx.querySelector(".cv"); if(cv) cv.textContent=state.hclose?"▸":"▾"; }
    return; }
  var tg=t.closest?t.closest("[data-tag]"):null;
  if(tg){ e.preventDefault(); state.tag=tg.getAttribute("data-tag"); renderTagbar(); toIndex(); return; }
  if(state.mask && t.classList && t.classList.contains("kw")) t.classList.toggle("open");
});
document.addEventListener("keydown",function(e){
  if(view!=="board") return;
  if(e.key==="ArrowLeft") move(-1);
  if(e.key==="ArrowRight") move(1);
});
/* スワイプ */
(function(){
  var x0=null,y0=null;
  document.addEventListener("touchstart",function(e){ if(view!=="board")return; x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  document.addEventListener("touchend",function(e){
    if(view!=="board"||x0===null)return;
    var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6) move(dx<0?1:-1);
    x0=null;
  },{passive:true});
})();

applyMask();
if(!DATA.length){ $("#list").innerHTML='<div class="emptymsg">データ（youten-data.js）が読み込めませんでした。</div>'; }
else {
  renderTagbar(); renderIndex();
  var mh=/^#c=(.+)$/.exec(location.hash||"");
  if(mh){
    var cid=decodeURIComponent(mh[1]);
    try{ history.replaceState(null,"",location.pathname); }catch(e){}
    openById(cid,false);
  }
}
</script>
</body>
</html>
